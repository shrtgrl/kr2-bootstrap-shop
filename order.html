<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка — OnSight</title>
    <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/custom.css">
</head>

<body class="d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
            <div class="container flex-lg-column">
                <a class="navbar-brand" href="index.html">
                    <img src="images/logo.svg" alt="OnSight" height="44">
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                    aria-controls="mainNavbar" aria-expanded="false" aria-label="Переключить навигацию">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="mainNavbar">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Главная</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="catalog.html">Каталог</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="product.html">Товар</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="order.html">Заявка</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="contacts.html">Контакты</a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                                aria-expanded="false">
                                Дополнительно
                            </a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="catalog.html">Все товары</a></li>
                                <li><a class="dropdown-item" href="order.html">Оформить заявку</a></li>
                                <li><a class="dropdown-item" href="index.html#popular">Популярное</a></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main class="container my-5 flex-grow-1">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="index.html">Главная</a></li>
                <li li class="breadcrumb-item active" aria-current="page">Заявка</li>
            </ol>
        </nav>
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h1 class="h4 mb-0">Форма заявки</h1>
                    </div>

                    <div class="card-body">
                        <div class="alert alert-info" role="alert">
                            Заполните форму. Поля со звёздочкой являются обязательными.
                        </div>

                        <form>
                            <div class="row g-3">
                                <div class="col-12 col-md-6">
                                    <label for="order-name" class="form-label">Имя *</label>
                                    <input id="order-name" name="name" type="text" class="form-control" required>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="order-email" class="form-label">E-mail *</label>
                                    <input id="order-email" name="email" type="email" class="form-control" required>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="order-phone" class="form-label">Телефон</label>
                                    <div class="input-group">
                                        <span class="input-group-text">+7</span>
                                        <input id="order-phone" name="phone" type="tel" class="form-control"
                                            placeholder="900 000-00-00">
                                    </div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="order-product" class="form-label">Товар *</label>
                                    <select id="order-product" name="product" class="form-select" required>
                                        <option value="" selected disabled>Выберите модель</option>
                                        <option value="onitsuka-tiger">Onitsuka Tiger Burnt Olive</option>
                                        <option value="adidas-liverpool">adidas Liverpool</option>
                                        <option value="red-Shoes">Красные бархатные лоферы</option>
                                        <option value="nike-Cortez">Nike Cortez</option>
                                        <option value="crocs-Shrek">Crocs Classic Clog DreamWorks Shrek</option>
                                        <option value="converse-Tyler">Tyler, The Creator x Converse 1908 Jogger</option>
                                        <option value="converse-X-Golf">Converse x GOLF le FLEUR* Pro Leather</option>
                                        <option value="Adilette-Aqua-Slides-Blue">Adidas Adilette Aqua Slides</option>
                                    </select>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="order-size" class="form-label">Размер *</label>
                                    <select id="order-size" name="size" class="form-select" required>
                                        <option value="" selected disabled>Выберите размер</option>
                                        <option value="38">38</option>
                                        <option value="39">39</option>
                                        <option value="40">40</option>
                                        <option value="41">41</option>
                                        <option value="42">42</option>
                                        <option value="43">43</option>
                                        <option value="44">44</option>
                                        <option value="45">45</option>
                                        <option value="46">46</option>
                                    </select>
                                </div>

                                <div class="col-12">
                                    <label for="order-comment" class="form-label">Комментарий</label>
                                    <textarea id="order-comment" name="comment" class="form-control"
                                        rows="4"></textarea>
                                </div>

                                <div class="col-12">
                                    <div class="form-check">
                                        <input id="order-agree" class="form-check-input" type="checkbox" required>
                                        <label class="form-check-label" for="order-agree">
                                            Я согласен на обработку данных *
                                        </label>
                                    </div>
                                </div>

                                <div class="col-12 d-flex gap-2">
                                    <button class="btn btn-primary" type="submit">
                                        Отправить заявку
                                    </button>
                                    <button class="btn btn-outline-secondary" type="reset">
                                        Очистить
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container">
            <div class="row align-items-center g-3">
                <div class="col-12 col-md-6">
                    <p class="mb-0">
                        &copy; 2026 OnSight. Учебный проект.
                    </p>
                </div>
                <div class="col-12 col-md-6 text-md-end">
                    <a class="text-white text-decoration-none me-3" href="index.html">
                        Главная
                    </a>
                    <a class="text-white text-decoration-none" href="catalog.html">
                        Каталог
                    </a>
                </div>
            </div>
        </div>
    </footer>
    
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>

</html>
